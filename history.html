<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>History - Sensor Tower Redirector</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: Inter, sans-serif; background: #fafafa; }
  </style>
</head>
<body class="min-h-screen p-4 sm:p-8 text-gray-800">
  <main class="max-w-2xl mx-auto">
    <a href="./index.html" class="inline-flex items-center gap-2 text-sm font-medium text-blue-600 hover:text-blue-800 mb-6">
      <i class="fa-solid fa-arrow-left" aria-hidden="true"></i> Back to Redirector
    </a>

    <section class="bg-white border border-gray-100 rounded-3xl shadow-sm p-5 sm:p-8">
      <div class="flex flex-wrap items-start justify-between gap-3 mb-2">
        <div>
          <h1 class="text-2xl font-bold text-gray-900">App History</h1>
          <p class="text-sm text-gray-500 mt-1">Apps you opened in Sensor Tower on this browser.</p>
        </div>
        <button id="clearAll" type="button" class="hidden rounded-xl px-3 py-2 text-sm font-medium text-red-600 border border-red-100 hover:bg-red-50">
          <i class="fa-regular fa-trash-can mr-1" aria-hidden="true"></i> Clear all
        </button>
      </div>

      <div class="relative mt-6 mb-4">
        <i class="fa-solid fa-magnifying-glass absolute left-4 top-1/2 -translate-y-1/2 text-gray-400" aria-hidden="true"></i>
        <input id="search" type="search" placeholder="Search by app ID or platform..." aria-label="Search history"
          class="w-full pl-11 pr-4 py-3 rounded-xl border border-gray-200 bg-gray-50 focus:bg-white outline-none focus:ring-2 focus:ring-blue-500 text-sm">
      </div>
      <p id="count" class="text-xs text-gray-500 mb-4" aria-live="polite"></p>
      <p id="storageError" class="hidden text-sm text-red-600 mb-4" role="alert"></p>

      <div id="empty" class="hidden text-center py-14">
        <div class="w-14 h-14 mx-auto rounded-2xl bg-blue-50 text-blue-500 flex items-center justify-center mb-4">
          <i class="fa-solid fa-clock-rotate-left text-xl" aria-hidden="true"></i>
        </div>
        <h2 id="emptyTitle" class="font-semibold text-gray-800">No history yet</h2>
        <p id="emptyText" class="text-sm text-gray-500 mt-1">Open an app from the redirector to see it here.</p>
      </div>

      <ul id="historyList" class="space-y-3" aria-label="Saved app history"></ul>
    </section>
    <p class="text-center text-xs text-gray-400 mt-5">Stored locally in this browser. No account or server required.</p>
  </main>

  <script>
    const STORAGE_KEY = 'sensorTowerHistory';
    const list = document.getElementById('historyList');
    const search = document.getElementById('search');
    const count = document.getElementById('count');
    const empty = document.getElementById('empty');
    const clearAll = document.getElementById('clearAll');
    const storageError = document.getElementById('storageError');

    function readHistory() {
      try {
        const data = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
        return Array.isArray(data) ? data.filter(item =>
          item && typeof item.id === 'string' &&
          (item.os === 'ios' || item.os === 'android') &&
          Number.isFinite(item.timestamp)
        ) : [];
      } catch (error) {
        storageError.textContent = 'Could not read saved history from this browser.';
        storageError.classList.remove('hidden');
        return [];
      }
    }

    let history = readHistory();

    function saveHistory() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(history));
        storageError.classList.add('hidden');
        return true;
      } catch (error) {
        storageError.textContent = 'Could not save changes. Browser storage may be disabled.';
        storageError.classList.remove('hidden');
        return false;
      }
    }

    function createElement(tag, className, text) {
      const element = document.createElement(tag);
      if (className) element.className = className;
      if (text !== undefined) element.textContent = text;
      return element;
    }

    function renderHistory() {
      const query = search.value.trim().toLowerCase();
      list.replaceChildren();
      const matches = history.map((item, index) => ({ item, index }))
        .filter(({ item }) => item.id.toLowerCase().includes(query) ||
          (item.os === 'ios' ? 'ios apple app store' : 'android google play').includes(query))
        .sort((a, b) => b.item.timestamp - a.item.timestamp);

      count.textContent = `${matches.length} shown · ${history.length} saved`;
      clearAll.classList.toggle('hidden', history.length === 0);
      empty.classList.toggle('hidden', matches.length !== 0);
      document.getElementById('emptyTitle').textContent = history.length ? 'No matching apps' : 'No history yet';
      document.getElementById('emptyText').textContent = history.length
        ? 'Try a different search.'
        : 'Open an app from the redirector to see it here.';

      for (const { item, index } of matches) {
        const isIOS = item.os === 'ios';
        const row = createElement('li', 'rounded-2xl border border-gray-100 bg-gray-50 p-4 flex flex-col sm:flex-row sm:items-center justify-between gap-3');
        const details = createElement('div', 'min-w-0 flex items-center gap-3');
        const iconWrap = createElement('div', 'w-10 h-10 shrink-0 rounded-xl bg-white border border-gray-100 flex items-center justify-center');
        const icon = createElement('i', isIOS ? 'fa-brands fa-apple text-gray-800 text-xl' : 'fa-brands fa-google-play text-emerald-600 text-lg');
        icon.setAttribute('aria-hidden', 'true');
        iconWrap.append(icon);

        const content = createElement('div', 'min-w-0');
        content.append(createElement('p', 'text-sm font-semibold text-gray-800', isIOS ? 'App Store (iOS)' : 'Google Play (Android)'));
        content.append(createElement('p', 'text-xs text-gray-600 font-mono break-all mt-1', item.id));
        const date = new Date(item.timestamp);
        content.append(createElement('p', 'text-xs text-gray-400 mt-1', Number.isNaN(date.getTime()) ? 'Date unavailable' : date.toLocaleString()));
        details.append(iconWrap, content);

        const actions = createElement('div', 'flex gap-2 shrink-0 sm:ml-3');
        const open = createElement('a', 'inline-flex items-center justify-center rounded-xl bg-blue-600 hover:bg-blue-700 text-white text-sm font-semibold px-4 py-2', 'Open');
        open.href = `https://app.sensortower.com/overview/${encodeURIComponent(item.id)}?os=${item.os}`;
        open.target = '_blank';
        open.rel = 'noopener noreferrer';
        open.setAttribute('aria-label', `Open ${item.id} in Sensor Tower`);

        const remove = createElement('button', 'rounded-xl border border-gray-200 hover:bg-red-50 hover:text-red-600 text-gray-500 px-3 py-2', 'Delete');
        remove.type = 'button';
        remove.setAttribute('aria-label', `Delete history entry for ${item.id}`);
        remove.addEventListener('click', () => {
          const updated = history.filter((_, position) => position !== index);
          const previous = history;
          history = updated;
          if (!saveHistory()) history = previous;
          renderHistory();
        });
        actions.append(open, remove);
        row.append(details, actions);
        list.append(row);
      }
    }

    clearAll.addEventListener('click', () => {
      if (!confirm('Delete all saved app history from this browser?')) return;
      const previous = history;
      history = [];
      if (!saveHistory()) history = previous;
      renderHistory();
    });

    search.addEventListener('input', renderHistory);
    window.addEventListener('storage', (event) => {
      if (event.key === STORAGE_KEY) {
        history = readHistory();
        renderHistory();
      }
    });
    renderHistory();
  </script>
</body>
</html>
