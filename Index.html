<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sensor Tower Redirector</title>

    <!-- Tailwind CSS for Styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        brand: '#2563eb',
                        brandHover: '#1d4ed8',
                    }
                }
            }
        };
    </script>
    <style>
        body { background-color: #fafafa; }

        .fade-in {
            animation: fadeIn 0.2s ease-out forwards;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(4px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 text-gray-800 font-sans">

    <main class="max-w-md w-full bg-white rounded-3xl shadow-[0_2px_20px_rgba(0,0,0,0.04)] border border-gray-100 p-6 sm:p-8">
        <!-- Header -->
        <div class="mb-6 text-center">
            <h1 class="text-2xl font-bold text-gray-900 mb-1">Sensor Tower</h1>
            <p class="text-gray-500 text-sm">Instantly redirect to app analytics.</p>
        </div>

        <!-- Main Content -->
        <div class="mb-2 relative">
            <input
                type="text"
                id="appInput"
                placeholder="Paste App Link or ID here..."
                aria-label="App Store or Google Play link or ID"
                class="w-full pl-4 pr-10 py-3.5 rounded-xl border border-gray-200 focus:ring-2 focus:ring-brand focus:border-brand outline-none transition-all text-gray-800 bg-gray-50 focus:bg-white text-sm"
                autocomplete="off"
                autofocus
            >
            <button id="clearBtn" type="button" class="absolute right-3 top-1/2 transform -translate-y-1/2 text-gray-400 hover:text-gray-600 hidden transition-colors" title="Clear input" aria-label="Clear input">
                <i class="fa-solid fa-circle-xmark text-lg" aria-hidden="true"></i>
            </button>
        </div>

        <!-- Clipboard Button -->
        <button id="clipboardBtn" type="button" class="mb-6 text-sm font-medium text-brand hover:text-brandHover flex items-center gap-1.5 transition-colors px-1">
            <i class="fa-regular fa-clipboard" aria-hidden="true"></i>
            <span id="clipboardBtnText">Paste from clipboard</span>
        </button>

        <!-- Validation Error Message -->
        <div id="errorMessage" role="alert" class="hidden mb-6 bg-red-50 text-red-600 px-4 py-3 rounded-xl text-sm flex items-start gap-2 border border-red-100 fade-in">
            <i class="fa-solid fa-circle-exclamation mt-0.5" aria-hidden="true"></i>
            <span>Invalid Android Package ID or iOS App ID.</span>
        </div>

        <!-- Result Area -->
        <div id="resultArea" class="hidden fade-in">
            <div class="bg-gray-50 rounded-xl p-3.5 mb-4 border border-gray-100 flex items-center justify-between">
                <div class="flex items-center gap-3 min-w-0">
                    <div class="w-8 h-8 rounded-full bg-white shadow-sm flex items-center justify-center border border-gray-100 shrink-0">
                        <i id="platformIcon" class="text-gray-700" aria-hidden="true"></i>
                    </div>
                    <div class="min-w-0">
                        <p id="platformText" class="text-sm font-semibold text-gray-800"></p>
                        <p id="extractedIdText" class="text-xs font-mono text-gray-500 mt-0.5 break-all"></p>
                    </div>
                </div>
            </div>

            <button id="redirectBtn" type="button" class="w-full bg-brand hover:bg-brandHover text-white font-semibold py-3.5 px-4 rounded-xl transition-all flex items-center justify-center gap-2 shadow-sm">
                <span>Open in Sensor Tower</span>
                <i class="fa-solid fa-arrow-right" aria-hidden="true"></i>
            </button>
        </div>

        <!-- NEW: History page link -->
        <a href="./history.html" class="mt-5 w-full flex items-center justify-center gap-2 rounded-xl border border-blue-100 bg-blue-50 hover:bg-blue-100 text-brand font-semibold text-sm py-3 transition-colors">
            <i class="fa-solid fa-clock-rotate-left" aria-hidden="true"></i>
            View History
        </a>

        <!-- Footer -->
        <div class="mt-6 pt-4 border-t border-gray-100 flex justify-center">
            <label class="flex items-center gap-2 text-xs font-medium text-gray-500 cursor-pointer hover:text-gray-700 transition-colors">
                <input type="checkbox" id="autoRedirect" class="rounded border-gray-300 text-brand focus:ring-brand w-3.5 h-3.5" checked>
                <span>Auto-redirect on paste</span>
            </label>
        </div>
    </main>

    <script>
        const STORAGE_KEY = 'sensorTowerHistory';

        const appInput = document.getElementById('appInput');
        const clearBtn = document.getElementById('clearBtn');
        const resultArea = document.getElementById('resultArea');
        const errorMessage = document.getElementById('errorMessage');
        const redirectBtn = document.getElementById('redirectBtn');
        const platformIcon = document.getElementById('platformIcon');
        const platformText = document.getElementById('platformText');
        const extractedIdText = document.getElementById('extractedIdText');
        const autoRedirect = document.getElementById('autoRedirect');
        const clipboardBtn = document.getElementById('clipboardBtn');
        const clipboardBtnText = document.getElementById('clipboardBtnText');

        let currentValidUrl = null;

        // Accept App Store URLs, iOS IDs, Play Store URLs, or Android package IDs.
        function extractSensorTowerInfo(input) {
            const cleanInput = input.trim();
            if (!cleanInput) return null;

            let id = null;
            let os = null;

            const iosUrlMatch = cleanInput.match(/\/id(\d+)/i);
            const iosIdMatch = cleanInput.match(/^id(\d+)$/i);
            const iosNumMatch = cleanInput.match(/^(\d{5,15})$/);

            if (iosUrlMatch) {
                id = iosUrlMatch[1];
                os = 'ios';
            } else if (iosIdMatch) {
                id = iosIdMatch[1];
                os = 'ios';
            } else if (iosNumMatch) {
                id = iosNumMatch[1];
                os = 'ios';
            }

            if (!id) {
                const androidUrlMatch = cleanInput.match(/[?&]?id=([^&]+)/i);
                const androidEqualsMatch = cleanInput.match(/^=([^&]+)/i);
                const androidPackageMatch = cleanInput.match(/^([a-zA-Z0-9_-]+\.[a-zA-Z0-9_.-]+)$/i);

                if (androidUrlMatch) {
                    id = androidUrlMatch[1];
                    os = 'android';
                } else if (androidEqualsMatch) {
                    id = androidEqualsMatch[1];
                    os = 'android';
                } else if (androidPackageMatch) {
                    id = androidPackageMatch[1];
                    os = 'android';
                }
            }

            if (id && os) {
                return {
                    id,
                    os,
                    url: `https://app.sensortower.com/overview/${encodeURIComponent(id)}?os=${os}`
                };
            }
            return null;
        }

        // NEW: Save every redirect to the same localStorage key used by history.html.
        function saveToHistory(info) {
            try {
                const stored = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
                const history = Array.isArray(stored) ? stored : [];

                history.unshift({
                    id: info.id,
                    os: info.os,
                    timestamp: Date.now()
                });

                // Keep the most recent 100 openings.
                localStorage.setItem(STORAGE_KEY, JSON.stringify(history.slice(0, 100)));
            } catch (error) {
                // The redirect still works when storage is unavailable.
                console.warn('Could not save Sensor Tower history:', error);
            }
        }

        function handleInputUpdate(isPaste = false) {
            const val = appInput.value;

            if (val.length > 0) {
                clearBtn.classList.remove('hidden');
            } else {
                clearBtn.classList.add('hidden');
                resetUI();
                return;
            }

            const info = extractSensorTowerInfo(val);

            if (info) {
                currentValidUrl = info.url;
                errorMessage.classList.add('hidden');
                resultArea.classList.remove('hidden');
                extractedIdText.textContent = info.id;

                if (info.os === 'ios') {
                    platformIcon.className = 'fa-brands fa-apple text-gray-800 text-lg';
                    platformText.textContent = 'App Store (iOS)';
                } else {
                    platformIcon.className = 'fa-brands fa-google-play text-emerald-500 text-sm';
                    platformText.textContent = 'Google Play (Android)';
                }

                if (isPaste && autoRedirect.checked) {
                    executeRedirect();
                }
            } else {
                currentValidUrl = null;
                resultArea.classList.add('hidden');
                errorMessage.classList.toggle('hidden', val.length <= 3);
            }
        }

        function resetUI() {
            currentValidUrl = null;
            resultArea.classList.add('hidden');
            errorMessage.classList.add('hidden');
        }

        // UPDATED: Record the app before opening it. No delayed popup.
        function executeRedirect() {
            if (!currentValidUrl) return;
            const info = extractSensorTowerInfo(appInput.value);
            if (!info) return;

            saveToHistory(info);
            window.open(info.url, '_blank', 'noopener,noreferrer');
        }

        clipboardBtn.addEventListener('click', async () => {
            try {
                const text = await navigator.clipboard.readText();
                if (text && text.trim() !== '') {
                    appInput.value = text;
                    handleInputUpdate(true);
                } else {
                    showClipboardStatus('Clipboard is empty', true);
                }
            } catch (error) {
                showClipboardStatus('Please paste manually', true);
                appInput.focus();
            }
        });

        function showClipboardStatus(message, isError) {
            const originalText = clipboardBtnText.textContent;
            clipboardBtnText.textContent = message;
            if (isError) clipboardBtn.classList.replace('text-brand', 'text-red-500');

            setTimeout(() => {
                clipboardBtnText.textContent = originalText;
                if (isError) clipboardBtn.classList.replace('text-red-500', 'text-brand');
            }, 2000);
        }

        appInput.addEventListener('input', () => handleInputUpdate(false));

        appInput.addEventListener('paste', () => {
            setTimeout(() => handleInputUpdate(true), 10);
        });

        appInput.addEventListener('keydown', (event) => {
            if (event.key === 'Enter' && currentValidUrl) {
                event.preventDefault();
                executeRedirect();
            }
        });

        clearBtn.addEventListener('click', () => {
            appInput.value = '';
            appInput.focus();
            handleInputUpdate();
        });

        redirectBtn.addEventListener('click', executeRedirect);
    </script>
</body>
</html>
